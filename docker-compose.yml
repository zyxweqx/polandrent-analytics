services:
  db:
    image: postgres:15-alpine
    container_name: polandrent_postgres
    restart: always
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  polandrent-app:
    build:
      context: .
      dockerfile: Dockerfile.scraper
    container_name: polandrent_container
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy
    command: >
      bash -c "python app/services/scraper.py &&
               python app/services/analytics.py"

  bot:
    build: .
    container_name: polandrent_bot
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      db:
        condition: service_healthy
    command: >
      bash -c "python app/bot/main.py"

  web:
    build: .
    container_name: polandrent_web
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8000"
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 5s
      timeout: 5s
      retries: 10
    command: >
      bash -c "alembic upgrade head &&
              uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data: