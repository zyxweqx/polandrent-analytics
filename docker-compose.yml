version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: polandrent_postgres
    restart: always
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  polandrent-app:
    build: .
    container_name: polandrent_container
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    command: >
      bash -c "alembic upgrade head &&
               python app/services/scraper.py &&
               python app/services/analytics.py"

  bot:
    build: .
    container_name: polandrent_bot
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: >
      bash -c "alembic upgrade head &&
               python app/bot/main.py"

volumes:
  postgres_data: